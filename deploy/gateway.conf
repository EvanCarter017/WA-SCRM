# The gateway of the platform: the one address everybody opens. It runs in a container on the platform's own
# network and finds the others by the names of their containers, through Docker's own name service — when a
# sub-site is made, started or stopped, nothing has to be written here.
#   the page, signing in, the accounts, the model relay     -> the first server (wa-scrm-master)
#   a sub-site's data and WhatsApp link, for its employee    -> the server of the sub-site the cookie scrm_site names
#   /site/<id>/api/data and /site/<id>/api/wa/... (the supervisor page) -> the server of the sub-site <id>
# The cookie and the name only say where a request goes: every server checks the session itself.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Docker's name service. A name is asked again after a few seconds, so a sub-site that was just started is found.
    resolver 127.0.0.11 valid=5s ipv6=off;
    # A line of the log has no query string: the address of a picture or a file carries a customer's number.
    log_format plain '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout plain;
    # The app limits its own requests (a save up to 8 MB, a file to send up to 16 MB); this only has to be above that.
    client_max_body_size 20m;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # What is sent up goes on to the server as it comes, and an answer is passed on at the pace of whoever reads
    # it: nothing is kept in /tmp meanwhile, which is memory here.
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A sub-site that is stopped is found out quickly; a page that waits for news of its WhatsApp link may wait.
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    # What goes out as text is compressed for the browser (plan 069): the page's program, its style sheets and the
    # data come to about a quarter of their size. Also when a proxy or a VPN is on the way, which nginx leaves out by
    # default; pictures, sound and the emoji font are compressed already. The text font (TrueType, plan 081) comes to
    # about two thirds of its size.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/plain font/ttf;

    # The sub-site an employee's cookie names — only if it is a name.
    map $cookie_scrm_site $scrm_cookie_site {
        default "";
        "~^(?<name>[a-z0-9][a-z0-9-]*)$" $name;
    }

    server {
        listen 8141;
        # An address the servers behind could read differently from here is refused, so that a request is
        # answered as the route it was passed for: a backslash, a slash or a backslash written as %2F or %5C, an
        # empty part, or a part of dots. Nobody asks so in earnest; the servers refuse the same themselves.
        if ($request_uri ~* "^[^?]*(\x5c|%2f|%5c|//|/(\.|%2e){1,2}(/|\?|$))") { return 400; }

        location / {
            set $scrm_upstream "wa-scrm-master";
            proxy_pass http://$scrm_upstream:8080;
        }
        # Signing in, and what else is asked about accounts, is small: a larger body is refused here already.
        location /api/auth/ {
            client_max_body_size 16k;
            set $scrm_upstream "wa-scrm-master";
            proxy_pass http://$scrm_upstream:8080;
        }
        # What OpenWA delivers goes from container to container, never through here.
        location = /api/wa/hook { return 404; }
        location ~ ^/site/[a-z0-9][a-z0-9-]*/api/wa/hook$ { return 404; }
        location = /api/data {
            set $scrm_upstream "wa-scrm-master";
            if ($scrm_cookie_site != "") { set $scrm_upstream "wa-scrm-site-$scrm_cookie_site"; }
            proxy_pass http://$scrm_upstream:8080;
        }
        location /api/wa/ {
            set $scrm_upstream "wa-scrm-master";
            if ($scrm_cookie_site != "") { set $scrm_upstream "wa-scrm-site-$scrm_cookie_site"; }
            proxy_pass http://$scrm_upstream:8080;
        }
        location ~ ^/site/(?<scrm_named>[a-z0-9][a-z0-9-]*)/api/(data$|wa/) {
            set $scrm_upstream "wa-scrm-site-$scrm_named";
            proxy_pass http://$scrm_upstream:8080;
        }
    }
}
