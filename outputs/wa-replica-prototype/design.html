<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内部工作台 · 组件样张</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"></head><body><main style="max-width:calc(100% - var(--space-48));width:var(--px-720);margin:var(--space-32) auto"><h1 style="font-size:var(--font-page);margin-bottom:var(--space-24)">工作台组件样张</h1><section class="page-panel" style="padding:var(--space-24)"><h2 style="font-size:var(--font-lg);margin-bottom:var(--space-20)">操作与字段</h2><div style="display:flex;gap:var(--space-12);margin-bottom:var(--space-24);flex-wrap:wrap"><button type="button" class="button primary">保存信息</button><button type="button" class="button">取消修改</button><button type="button" class="button" disabled>暂无可选项</button><span class="tag jade">已连接</span><span class="tag gold">待处理</span></div><div class="form-grid"><label class="field">账号名称<input name="account-name" autocomplete="off" value="美国咨询账号"></label><label class="field">状态<select name="state"><option>在线</option><option>待连接</option></select></label><label class="field full">错误说明<input name="required-example" autocomplete="off" aria-invalid="true" aria-describedby="example-error" placeholder="填写客户称呼…"><small id="example-error" class="field-error">请填写客户称呼，便于后续检索。</small></label></div></section><section class="page-panel" style="margin-top:var(--space-24)"><table class="data-table"><thead><tr><th>客户</th><th>阶段</th><th>负责人</th><th>操作</th></tr></thead><tbody><tr><td>Ava Thompson</td><td><span class="stage won">跟进中</span></td><td>林予</td><td><button type="button" class="button small">查看资料</button></td></tr></tbody></table></section><p style="margin-top:var(--space-20);font-size:var(--font-xs);color:var(--color-text-muted)">组件采用自己的颜色角色和图标体系。这里只展示界面状态。</p></main></body></html>
